project: sleep-staging
data:
  _name: wuji_dl.data.DefaultDataModule
  common:
    _name: data.sleep_staging.SleepStagingDataset
    max_tokens: 1535
    token_sec: 30
    num_workers: 4
    features:
      - src_name: heartbeat
        input_channels: 1
        token_len: 120
      - src_name: breath
        input_channels: 1
        token_len: 120
      - src_name: stage
        input_channels: 1
        token_len: 1
        is_input: False
        dtype: long
        pad_value: -1
  train:
    shuffle: True
    split: train
  val:
    split: val
  test:
    split: test
task:
  _name: tasks.sleep_staging.SleepStagingTask
  stages: ["W", "N1+N2", "N3", "R"]
  criterion:
    _name: wuji_dl.ops.CrossEntropyLoss
    weight: [0.24 , 0.24 , 0.28 , 0.24]
    ignore_index: -1
  model:
    features:
      - head: heartbeat
        input_channels: 1
        token_len: 120
      - head: breath
        input_channels: 1
        token_len: 120
    num_classes: 4
callbacks:
  ckpt_best:
    _name: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/acc
    mode: max
    save_weights_only: False
  early_stopping:
    _name: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/acc
    mode: max
    patience: ${PATIENCE}
  pbar:
    _name: lightning.pytorch.callbacks.RichProgressBar
    leave: True
trainer:
  log_every_n_steps: 10
  max_epochs: 100
  precision: bf16
