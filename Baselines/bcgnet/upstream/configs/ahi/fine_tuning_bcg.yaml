_base: 
  - configs/ahi/base.yaml


project: ah-events
data:
  _name: wuji_dl.data.DefaultDataModule
  common:
    _name: data.sleep_staging.SleepStagingDataset
    max_tokens: 1800
    stride_tokens: 1800
    weighted_sampling: ahi_class
    token_sec: 1
    num_workers: 64

    features:
      - src_name: heartbeat
        input_channels: 1
        token_len: 4

      - src_name: snore_bandpass
        input_channels: 1
        token_len: 400

      - src_name: heartbeat_bandpass
        input_channels: 1
        token_len: 50
      
      - src_name: ahi_class
        is_attribute: True
        from_csv: True
        is_input: False

      - src_name: breath_bandpass
        input_channels: 1
        token_len: 2

      - src_name: breath
        input_channels: 1
        token_len: 4

      - src_name: ah_event
        input_channels: 1
        token_len: 1
        is_input: False
      
    index: index/example.csv
    batch_size: 32
    r_margin: 0
    memmap: false     
  train:
    shuffle: false
    split: train
  val:
    split: val
  test:
    split: shanghai-test
task:
  _name: tasks.ahi.AHITask
  criterion:
    _name: losses.dicefocal.FocalLossWrapper
  model:
    num_classes: 1
    _name: models.sleep_staging.SleepStagingNet
    pretrain_task: tasks.ahi.AHITask
    pretrained: log/ah-events/psg_ahi-fit-42-0527-204952/checkpoints/epoch=18-step=211736.ckpt
    unfreeze_backbone: True
  optimizer:
    _name: torch.optim.Adam
    lr: 1.0e-5
callbacks:
  ckpt_best:
    _name: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/f1
    mode: max
    save_weights_only: false
  early_stopping:
    _name: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/f1
    mode: max
    patience: ${PATIENCE}
  pbar:
    _name: lightning.pytorch.callbacks.RichProgressBar
    leave: true
trainer:
  log_every_n_steps: 10
  max_epochs: 100
  precision: 32
PATIENCE: 10
